version: '3.8'

# Development mode — use with: docker compose -f docker-compose.dev.yml up
# For production, use: docker compose up (uses docker-compose.yml)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - LOG_LEVEL=INFO
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - FEATHERLESS_API_KEY=${FEATHERLESS_API_KEY}
      - QWEN_API_KEY=${QWEN_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - BAND_EXPLORER_ID=${BAND_EXPLORER_ID}
      - BAND_DOCUMENTER_ID=${BAND_DOCUMENTER_ID}
      - BAND_MENTOR_ID=${BAND_MENTOR_ID}
      - BAND_REVIEWER_ID=${BAND_REVIEWER_ID}
      - BAND_TASK_SUGGESTER_ID=${BAND_TASK_SUGGESTER_ID}
    volumes:
      - ./backend:/app
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
