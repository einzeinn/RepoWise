version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - LOG_LEVEL=WARNING
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - FEATHERLESS_API_KEY=${FEATHERLESS_API_KEY}
      - QWEN_API_KEY=${QWEN_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - BAND_ENABLED=${BAND_ENABLED:-false}
      - BAND_EXPLORER_ID=${BAND_EXPLORER_ID}
      - BAND_EXPLORER_KEY=${BAND_EXPLORER_KEY}
      - BAND_DOCUMENTER_ID=${BAND_DOCUMENTER_ID}
      - BAND_DOCUMENTER_KEY=${BAND_DOCUMENTER_KEY}
      - BAND_MENTOR_ID=${BAND_MENTOR_ID}
      - BAND_MENTOR_KEY=${BAND_MENTOR_KEY}
      - BAND_REVIEWER_ID=${BAND_REVIEWER_ID}
      - BAND_REVIEWER_KEY=${BAND_REVIEWER_KEY}
      - BAND_TASK_SUGGESTER_ID=${BAND_TASK_SUGGESTER_ID}
      - BAND_TASK_SUGGESTER_KEY=${BAND_TASK_SUGGESTER_KEY}
    # Dockerfile CMD uses production uvicorn (no reload, 2 workers)

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend
