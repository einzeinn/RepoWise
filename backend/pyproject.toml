[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repowise-backend"
version = "0.1.0"
description = "Multi-Agent Repository Explorer - Backend"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "REPOWISE Team", email = "team@repowise.dev"}
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "PyGithub>=2.1.1",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.2",
    "websockets>=12.0",
    "aiohttp>=3.9.1",
    "PyYAML>=6.0.1",
    "typing-extensions>=4.9.0",
    "band-sdk>=0.2.11",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "black==23.12.1",
    "flake8==6.1.0",
    "mypy==1.7.1",
    "ruff==0.1.11",
]

[tool.setuptools]
packages = ["agents"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
